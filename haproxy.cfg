global
    log stdout format raw local0

    stats socket 0.0.0.0:9999 level admin
    stats timeout 30s

    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option log-health-checks
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_front
    bind *:80
    default_backend my_backend

backend my_backend
    balance roundrobin

    option httpchk GET /
    http-check expect status 200
