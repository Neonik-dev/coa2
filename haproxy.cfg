global
    log stdout format raw local0
    stats socket 0.0.0.0:9999 level admin
    stats timeout 30s
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option log-health-checks
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_front
    bind *:80

    use_backend service1_backend if { path_beg /service1/ }
    use_backend my_backend if { path_beg /service2/ }

    default_backend service1_backend

backend service1_backend
    balance roundrobin
    option httpchk GET /actuator/health
    http-check expect status 200

    # Временно статические адреса
    server service1_1 host.docker.internal:8052 check
    server service1_2 host.docker.internal:8053 check

backend my_backend
    balance roundrobin

    option httpchk GET /
    http-check expect status 200
