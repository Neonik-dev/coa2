name: coa2

services:
  postgres:
    image: postgres
    environment:
      POSTGRES_DB: "coa2"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    ports:
      - "5432:5432"
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.8
    container_name: es
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - es-net

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.9
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://es:9200
    ports:
      - "5601:5601"
    networks:
      - es-net
    depends_on:
      - elasticsearch
  haproxy:
    image: haproxy:2.9
    container_name: haproxy
    user: root
    ports:
      - "80:80"
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - haproxy-sock:/var/run
    restart: unless-stopped
    command: [ "sh", "-c", "apt-get update && apt-get install -y socat && haproxy -f /usr/local/etc/haproxy/haproxy.cfg" ]

volumes:
  esdata:
  haproxy-sock:

networks:
  es-net:
    driver: bridge