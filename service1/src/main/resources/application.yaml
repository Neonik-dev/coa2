spring:
  application:
    name: service1
    instance_id: test1
  elasticsearch:
    uris: http://localhost:9200
  datasource:
    url: jdbc:postgresql://localhost:5432/coa2
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create
    show-sql: false
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        enabled: true
        register: true
        instance-id: ${spring.application.name}:${spring.application.instance-id:${random.value}}
        health-check-path: /actuator/health
        health-check-interval: 15s
        health-check-timeout: 10s
        prefer-ip-address: true
      config:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    shutdown:
      enabled: true

logging:
  level:
    org.springframework.cloud.consul: DEBUG
    com.ecwid.consul: DEBUG

server:
  error:
    whitelabel:
      enabled: false
  port: 8052
  ssl:
    key-store: classpath:keytool2/keystore.p12
    key-store-password: rootroot
    key-store-type: PKCS12
    key-alias: myserver
    enabled: false
